name: Inspect LHM

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Create inspection folder
        run: mkdir -p /tmp/inspection/key_files

      - name: Clone LHM into runner
        run: git clone --depth 1 https://github.com/aigc3d/LHM.git /tmp/LHM

      - name: Generate file tree with sizes
        run: |
          cd /tmp/LHM
          echo "=== REPO TREE (with file sizes) ===" > /tmp/inspection/tree.txt
          find . -path ./.git -prune -o -type f -print | sort | while read f; do
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            printf "%10d  %s\n" "$size" "$f"
          done >> /tmp/inspection/tree.txt

      - name: Directory sizes
        run: |
          cd /tmp/LHM
          echo "=== DIRECTORY SIZES ===" > /tmp/inspection/dirs.txt
          du -sh */ 2>/dev/null | sort -h >> /tmp/inspection/dirs.txt
          echo "" >> /tmp/inspection/dirs.txt
          echo "=== TOTAL ===" >> /tmp/inspection/dirs.txt
          du -sh . >> /tmp/inspection/dirs.txt
          cat /tmp/inspection/dirs.txt

      - name: Copy key files for review
        run: |
          cd /tmp/LHM
          for f in \
            "LHM/launch.py" \
            "LHM/runners/infer/human_lrm.py" \
            "LHM/models/modeling_human_lrm.py" \
            "LHM/models/encoders/sapiens_warpper.py" \
            "inference_mesh.sh" \
            "inference.sh" \
            "requirements.txt" \
            "README.md" \
            "configs/inference/human-lrm-500M.yaml" \
          ; do
            if [ -f "$f" ]; then
              outname=$(echo "$f" | tr '/' '_')
              cp "$f" "/tmp/inspection/key_files/$outname"
              echo "✅ $f → $outname"
            else
              echo "❌ Missing: $f"
            fi
          done

      - name: Top 30 largest files
        run: |
          cd /tmp/LHM
          echo "=== TOP 30 LARGEST FILES ===" > /tmp/inspection/largest.txt
          find . -path ./.git -prune -o -type f -print | while read f; do
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            printf "%10d  %s\n" "$size" "$f"
          done | sort -rn | head -30 >> /tmp/inspection/largest.txt
          cat /tmp/inspection/largest.txt

      - name: Count files by extension
        run: |
          cd /tmp/LHM
          echo "=== FILE COUNT BY EXTENSION ===" > /tmp/inspection/counts.txt
          find . -path ./.git -prune -o -type f -print | \
            grep -oE '\.[a-zA-Z0-9]+$' | sort | uniq -c | sort -rn | head -20 >> /tmp/inspection/counts.txt
          cat /tmp/inspection/counts.txt

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: lhm-inspection
          path: /tmp/inspection/
          retention-days: 30
