name: Print LHM Tree

on:
  workflow_dispatch:

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - name: Clone LHM
        run: git clone --depth 1 https://github.com/aigc3d/LHM.git /tmp/LHM

      - name: Top-level structure
        run: |
          cd /tmp/LHM
          echo "=== TOP-LEVEL FILES/FOLDERS ==="
          ls -la

      - name: Two-level folder tree (folders only)
        run: |
          cd /tmp/LHM
          echo "=== 2-LEVEL FOLDER TREE ==="
          find . -maxdepth 2 -type d | grep -v '\.git' | sort

      - name: File count per top-level folder
        run: |
          cd /tmp/LHM
          echo "=== FILE COUNT PER TOP-LEVEL FOLDER ==="
          for d in */ ; do
            count=$(find "$d" -type f | wc -l)
            size=$(du -sh "$d" | cut -f1)
            printf "%6s files  %6s  %s\n" "$count" "$size" "$d"
          done

      - name: Files inside LHM/ folder
        run: |
          cd /tmp/LHM
          echo "=== FILES UNDER LHM/ ==="
          find LHM -type f | sort

      - name: Files inside engine/ (top 2 levels only)
        run: |
          cd /tmp/LHM
          echo "=== FILES UNDER engine/ (2 levels) ==="
          find engine -maxdepth 2 -type f | sort

      - name: Key file contents
        run: |
          cd /tmp/LHM
          echo "=== LHM/launch.py ==="
          cat LHM/launch.py
          echo ""
          echo "=== inference_mesh.sh ==="
          cat inference_mesh.sh
